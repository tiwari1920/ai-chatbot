<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiwari</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Tiwari</span>
      </div>

      <button class="new-chat" id="newChatBtn">+ New chat</button>

      <nav class="history" id="historyList" aria-label="Conversation history">
        <p class="history-empty" id="historyEmpty">Your conversations will show up here.</p>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking connection…</span>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div>
          <h1 id="chatTitle">New conversation</h1>
          <p class="chat-sub">Model: <span id="modelName">—</span></p>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <p class="empty-kicker">Start typing below</p>
          <h2>What are we figuring out today?</h2>
          <p class="empty-sub">Messages are saved per browser session, so you can leave and come back.</p>
        </div>
      </div>

      <form class="composer" id="composerForm">
        <textarea
          id="messageInput"
          placeholder="Message the assistant…"
          rows="1"
          maxlength="8000"
          required
        ></textarea>
        <button type="submit" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <footer class="app-footer">
        <span>© 2026 Satyam Tiwari</span>
        <a href="mailto:iamsatyampandit@gmail.com">iamsatyampandit@gmail.com</a>
      </footer>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
